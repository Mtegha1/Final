<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="View property details and agent information for reviewed listings in Malawi.">
    <title>Property details | Iconics Real Estate Agency</title>
    <link rel="stylesheet" href="assets/template75/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/template75/css/fontawesome.css">
    <link rel="stylesheet" href="assets/template75/css/style.css">
    <link rel="stylesheet" href="assets/template75/css/irea.css">
    <script src="assets/js/api.js"></script>
    <script src="assets/js/template75.js" defer></script>
</head>
<body>
    <div class="sub-header">
        <div class="container">
            <ul class="left-info">
                <li><a href="auth.html?mode=login"><i class="fa fa-lock" aria-hidden="true"></i>Secure access for clients and agents</a></li>
            </ul>
        </div>
    </div>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="index.html"><h2>Iconics <em>Real Estate</em></h2></a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item active"><a class="nav-link" href="property.html" aria-current="page">Properties</a></li>
                        <li class="nav-item"><a class="nav-link" href="auth.html?mode=login">Sign in</a></li>
                        <li class="nav-item"><a class="nav-link" href="auth.html?mode=register">Join as agent</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-heading header-text">
            <div class="container">
                <h1 id="property-heading">Property details</h1>
                <span id="property-summary">Loading listing information…</span>
            </div>
        </section>

        <section class="services irea-detail">
            <div class="container" id="property-detail" aria-live="polite">
                <p class="irea-message">Loading property details…</p>
            </div>
        </section>
    </main>

    <footer class="irea-footer">
        <div class="container">
            <a href="index.html" class="irea-footer-brand">Iconics Real Estate Agency</a>
            <p>Helping you find a place to call home in Malawi.</p>
            <div class="irea-footer-links"><a href="property.html">Browse properties</a><a href="auth.html?mode=login">Sign in</a></div>
        </div>
    </footer>

    <script>
        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
            });
        }
        async function loadPropertyDetail() {
            const target = document.getElementById('property-detail');
            const id = new URLSearchParams(window.location.search).get('id');
            if (!id) {
                document.getElementById('property-summary').textContent = 'Choose a property from the browse page to view its details.';
                target.innerHTML = '<p class="irea-message">No property was selected. <a href="property.html">Browse available properties</a>.</p>';
                return;
            }
            const response = await Iconics.call('property/list', 'GET');
            if (response.status !== 'success' || !Array.isArray(response.data)) {
                document.getElementById('property-summary').textContent = 'Listing information is temporarily unavailable.';
                target.innerHTML = '<p class="irea-message" role="status">Property details could not be loaded. Please try again later.</p>';
                return;
            }
            const property = response.data.find(function (item) { return String(item.id) === id; });
            if (!property) {
                document.getElementById('property-summary').textContent = 'This listing may no longer be available.';
                target.innerHTML = '<p class="irea-message">This approved property is no longer available. <a href="property.html">Browse current listings</a>.</p>';
                return;
            }
            const image = property.image_url
                ? '../uploads/properties/' + encodeURIComponent(property.image_url)
                : 'assets/template75/images/product-1-720x480.jpg';
            const coordinates = property.latitude != null && property.longitude != null
                ? '<p><strong>Map pin:</strong> ' + escapeHtml(property.latitude) + ', ' + escapeHtml(property.longitude) + '</p>'
                : '<p><strong>Map pin:</strong> Not provided</p>';
            const verification = property.verification_status === 'verified'
                ? '<span class="irea-verification is-verified"><i class="fa fa-check-circle" aria-hidden="true"></i> Verified agent</span>'
                : '<span class="irea-verification">Agent verification not confirmed</span>';
            document.getElementById('property-heading').textContent = property.title || 'Property details';
            document.getElementById('property-summary').textContent =
                (property.property_type || 'Property') + ' / ' + (property.area_name || 'Malawi');
            target.innerHTML = '<div class="row">' +
                '<div class="col-lg-7"><img class="img-fluid irea-detail-image" src="' + image + '" alt="' +
                escapeHtml(property.title) + '" loading="lazy"></div>' +
                '<div class="col-lg-5"><section class="irea-detail-card" aria-label="Property information">' +
                '<p class="irea-detail-price">MWK ' + Number(property.price || 0).toLocaleString() + '</p>' +
                '<ul class="list-group list-group-flush">' +
                '<li class="list-group-item"><span>Type</span><strong>' +
                escapeHtml(property.property_type || 'Not specified') + '</strong></li>' +
                '<li class="list-group-item"><span>Area</span><strong>' +
                escapeHtml(property.area_name || 'Not specified') + '</strong></li>' +
                '<li class="list-group-item"><span>Listed by</span><strong>' +
                escapeHtml(property.full_name || property.agent_name || 'Property agent') + '</strong></li></ul>' +
                '<div class="irea-agent-status">' + verification + '</div></section></div></div>' +
                '<div class="row irea-detail-lower"><div class="col-lg-8"><section class="irea-description">' +
                '<h2>Description</h2><p>' + escapeHtml(property.description || 'No description provided.') +
                '</p></section></div><div class="col-lg-4"><section class="irea-location">' +
                '<h2>Location</h2>' + coordinates + '</section></div></div>';
        }
        loadPropertyDetail();
    </script>
    <script src="assets/template75/vendor/jquery/jquery.min.js"></script>
    <script src="assets/template75/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
