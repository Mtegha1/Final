<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard — Iconics</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <style>
        :root {
            --primary-dark: #0f1923;
            --accent-green: #35ac39;
            --bg-page: #f4f5f7;
            --card-bg: #ffffff;
            --border-light: rgba(0, 0, 0, 0.07);
            --radius-md: 8px;
            --radius-lg: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-page);
            background-image: linear-gradient(rgba(15, 25, 35, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 25, 35, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* ── Sidebar ── */
        .sidebar {
            height: 100vh;
            background: var(--primary-dark);
            color: white;
            position: fixed;
            width: 220px;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-brand {
            padding: 22px 20px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .sidebar-brand h2 {
            font-family: 'Playfair Display', serif;
            font-size: 19px;
            color: var(--accent-green);
            margin: 0;
        }

        .sidebar-brand .sub {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.32);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .sidebar-user {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .sidebar-user span {
            display: block;
            font-weight: 600;
            color: white;
            font-size: 13px;
            margin-top: 2px;
        }

        .nav-link {
            color: #adb5bd;
            padding: 11px 22px;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 9px;
            border-left: 3px solid transparent;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-link i {
            font-size: 16px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border-left-color: var(--accent-green);
        }

        .nav-link.text-danger {
            color: #f87171 !important;
        }

        .nav-link.text-danger:hover {
            border-left-color: #dc3545;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 14px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            text-align: center;
        }

        /* ── Main ── */
        .main-content {
            margin-left: 220px;
            padding: 36px 40px;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            margin: 0;
            color: #1a1a18;
        }

        .page-header .sub {
            font-size: 13px;
            color: #777;
            margin-top: 4px;
        }

        /* ── Tabs ── */
        .tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .tab-btn {
            font-size: 13px;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: #777;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: 0.2s;
        }

        .tab-btn.active {
            color: var(--primary-dark);
            border-bottom-color: var(--accent-green);
        }

        /* ── Property cards ── */
        .property-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .property-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 0.5px solid var(--border-light);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .property-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.09);
        }

        .property-image {
            height: 190px;
            background-size: cover;
            background-position: center;
            background-color: #dde1e7;
            position: relative;
        }

        .price-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: var(--primary-dark);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 13px;
        }

        .type-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--primary-dark);
            padding: 3px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            text-transform: capitalize;
        }

        .card-body-inner {
            padding: 16px;
        }

        .card-body-inner h6 {
            font-weight: 700;
            font-size: 14px;
            color: #1a1a18;
            margin-bottom: 4px;
        }

        .card-location {
            font-size: 12px;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 14px;
        }

        .btn-book {
            width: 100%;
            background: var(--primary-dark);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            padding: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-book:hover {
            background: #1a2a3a;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-details {
            background: transparent;
            color: var(--primary-dark);
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-details:hover {
            border-color: var(--primary-dark);
            background: #f4f5f7;
        }

        /* ── Property Details Modal ── */
        .detail-image {
            height: 210px;
            border-radius: var(--radius-lg);
            background-size: cover;
            background-position: center;
            background-color: #dde1e7;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .detail-type-pill {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--primary-dark);
            color: white;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .detail-price-pill {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: var(--accent-green);
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .detail-field {
            background: #f9fafb;
            border: 0.5px solid #e5e7eb;
            border-radius: var(--radius-md);
            padding: 12px 14px;
        }

        .detail-field .df-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .detail-field .df-value {
            font-size: 13px;
            font-weight: 600;
            color: #1a1a18;
        }

        .detail-field.full {
            grid-column: 1 / -1;
        }

        .detail-description {
            font-size: 13px;
            font-weight: 400;
            color: #555;
            line-height: 1.65;
        }

        .detail-agent-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .detail-agent-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(53, 172, 57, 0.12);
            color: var(--accent-green);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .detail-agent-name {
            font-size: 13px;
            font-weight: 600;
            color: #1a1a18;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: #ccc;
        }

        .empty-state i {
            font-size: 36px;
            display: block;
            margin-bottom: 10px;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 13px;
            margin: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            <h2>Iconics</h2>
            <div class="sub">FDVIS Platform</div>
        </div>
        <div class="sidebar-user">
            Welcome back,
            <span id="client-name">—</span>
        </div>
        <nav class="nav flex-column" style="margin-top: 8px;">
            <a class="nav-link active" onclick="showTab('explore', this)"><i class="ti ti-smart-home"></i> Explore</a>
            <hr style="border-color: rgba(255,255,255,0.08); margin: 8px 22px;">
            <a class="nav-link text-danger" onclick="logout()"><i class="ti ti-logout"></i> Logout</a>
        </nav>
        <div class="sidebar-footer">IREA / FDVIS &nbsp;·&nbsp; Rental Trust Platform</div>
    </div>

    <div class="main-content">

        <!-- EXPLORE TAB -->
        <div id="tab-explore" class="tab-content">
            <div class="page-header">
                <div>
                    <h1>Available Properties</h1>
                    <div class="sub">Browse approved property listings.</div>
                </div>
            </div>
            <div class="property-grid" id="property-grid">

                <div class="empty-state" style="grid-column:1/-1">
                    <i class="ti ti-loader"></i>
                    <p>Loading properties…</p>
                </div>
            </div>
        </div>

    </div>

    <!-- PROPERTY DETAILS MODAL -->
    <div class="modal fade" id="propertyDetailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 500px;">
            <div class="modal-content" style="border-radius: 16px; border: none; overflow: hidden;">

                <div class="modal-header" style="border-bottom: 0.5px solid #f0f0f0; padding: 18px 24px;">
                    <h5 class="modal-title fw-bold" style="font-size:15px;">Property Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body" style="padding: 24px;">

                    <!-- Image with overlaid badges -->
                    <div class="detail-image" id="detail-image">
                        <span class="detail-type-pill" id="detail-type">—</span>
                        <span class="detail-price-pill" id="detail-price">—</span>
                    </div>

                    <!-- Title full-width -->
                    <div class="detail-grid">
                        <div class="detail-field full">
                            <div class="df-label">Property Title</div>
                            <div class="df-value" id="detail-title">—</div>
                        </div>

                        <!-- Area + Trust Score side by side -->
                        <div class="detail-field">
                            <div class="df-label"><i class="ti ti-map-pin" style="font-size:11px;"></i> Area</div>
                            <div class="df-value" id="detail-area">—</div>
                        </div>
                        <div class="detail-field">
                            <div class="df-label"><i class="ti ti-shield-check" style="font-size:11px;"></i> Agent Trust
                            </div>
                            <div class="df-value" id="detail-trust">—</div>
                        </div>

                        <!-- Description full-width -->
                        <div class="detail-field full">
                            <div class="df-label">Description</div>
                            <div class="detail-description" id="detail-description">—</div>
                        </div>

                        <!-- Agent full-width -->
                        <div class="detail-field full">
                            <div class="df-label">Listed by</div>
                            <div class="detail-agent-row">
                                <div class="detail-agent-avatar" id="detail-agent-avatar">—</div>
                                <div class="detail-agent-name" id="detail-agent">—</div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const propertyMap = {};
        let detailsModalInstance = null;

        async function showTab(tab, element) {
            document.querySelectorAll('.tab-content').forEach(section => section.style.display = 'none');
            const target = document.getElementById('tab-' + tab);
            if (target) target.style.display = 'block';
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            if (element) element.classList.add('active');
        }

        window.onload = async () => {
            try {
                const auth = await Iconics.check();
                const user = auth?.data?.user || auth?.data || {};
                if (!auth || auth.status !== 'success' || user.role !== 'client') {
                    window.location.href = '../auth.html';
                    return;
                }
                document.getElementById('client-name').textContent = user.full_name || user.name || 'Client';
                await loadProperties();
            } catch (error) {
                console.error('Authentication error:', error);
                alert('Failed to load dashboard.');
            }
        };

        async function loadProperties() {
            const grid = document.getElementById('property-grid');
            try {
                const response = await Iconics.call('property/approved', 'GET');
                if (response?.status === 'success' && Array.isArray(response.data) && response.data.length) {
                    response.data.forEach(property => propertyMap[property.id] = property);
                    grid.innerHTML = response.data.map(property => `
                        <div class="property-card">
                            <div class="property-image" style="background-image:url('../../uploads/properties/${property.image_url || property.image || 'default.jpg'}')">
                                <div class="type-badge">${property.property_type || 'Property'}</div>
                                <div class="price-badge">MWK ${Number(property.price || 0).toLocaleString()}</div>
                            </div>
                            <div class="card-body-inner">
                                <h6>${property.title || 'Untitled Property'}</h6>
                                <div class="card-location"><i class="ti ti-map-pin"></i>${property.area_name || 'Unknown Area'}</div>
                                <div class="card-actions">
                                    <button class="btn-details" type="button" onclick="openDetailsModal(${property.id})"><i class="ti ti-eye"></i> Details</button>
                                </div>
                            </div>
                        </div>`).join('');
                    return;
                }
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="ti ti-building-off"></i><p>No approved properties found.</p></div>';
            } catch (error) {
                console.error('Load properties error:', error);
                grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="ti ti-alert-circle"></i><p>Failed to load properties.</p></div>';
            }
        }

        function openDetailsModal(propertyId) {
            const property = propertyMap[propertyId];
            if (!property) return;
            const imageUrl = property.image_url || property.image || '';
            const imageElement = document.getElementById('detail-image');
            imageElement.style.backgroundImage = imageUrl ? `url('../../uploads/properties/${imageUrl}')` : 'none';
            document.getElementById('detail-type').textContent = property.property_type || 'Property';
            document.getElementById('detail-price').textContent = 'MWK ' + Number(property.price || 0).toLocaleString();
            document.getElementById('detail-title').textContent = property.title || '—';
            document.getElementById('detail-area').textContent = property.area_name || '—';
            document.getElementById('detail-description').textContent = property.description || 'No description provided.';
            document.getElementById('detail-trust').textContent = property.trust_score != null ? Number(property.trust_score).toFixed(1) + ' / 100' : 'N/A';
            const agentName = property.full_name || property.agent_name || 'Unknown Agent';
            const nameParts = agentName.trim().split(' ');
            const initials = nameParts.length > 1 ? nameParts[0][0] + nameParts[nameParts.length - 1][0] : (nameParts[0] || 'A')[0];
            document.getElementById('detail-agent-avatar').textContent = initials.toUpperCase();
            document.getElementById('detail-agent').textContent = agentName;
            detailsModalInstance = bootstrap.Modal.getOrCreateInstance(document.getElementById('propertyDetailsModal'));
            detailsModalInstance.show();
        }

        async function logout() {
            try {
                await Iconics.call('auth/logout', 'POST');
            } catch (error) {
                console.error('Logout error:', error);
            }
            window.location.href = '../auth.html';
        }
    </script>

</body>

</html>
